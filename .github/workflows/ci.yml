name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/epa -run '^$' -fuzz '^FuzzParseProgress$' -fuzztime 10s -parallel 2
      - name: Interactive PTY integration
        run: |
          go test -c -o /tmp/epa-pty.test ./internal/epa
          python3 tests/pty_integration.py /tmp/epa-pty.test
      - name: Root self-update safety in disposable container
        if: matrix.go == 'stable'
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/epa-root-update.test ./internal/epa
          docker run --rm --network none -e EPA_TEST_ROOT_INSTALL=1 --mount type=bind,source=/tmp/epa-root-update.test,target=/epa-test,readonly debian:12 \
            sh -ec 'install -m 0755 /epa-test /usr/local/bin/epa; /usr/local/bin/epa -test.v -test.run "^(TestRootDefaultInstall|TestSystemUpdateTarget|TestUpdateFromRelease)$"'
      - run: CGO_ENABLED=0 go build -trimpath -o epa ./cmd/epa
      - name: 버전 및 드라이런
        shell: bash
        run: |
          ./epa --version
          ./epa --style apt --progress native --dry-run install bash -y
          ./epa --style pacman --progress native --dry-run -Syu
      - name: 자동완성 테스트 환경 준비
        shell: bash
        run: |
          echo "XDG_CONFIG_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y zsh
          apt-cache pkgnames bas | grep -Fx bash
      - name: Bash 자동완성
        shell: bash
        run: |
          ./epa completion bash > "$RUNNER_TEMP/epa-completion.bash"
          bash -n "$RUNNER_TEMP/epa-completion.bash"
          export PATH="$PWD:$PATH"
          ./epa __complete -- install bas | grep -Fx bash
          source "$RUNNER_TEMP/epa-completion.bash"
          COMP_WORDS=(epa install bas)
          COMP_CWORD=2
          _epa_complete
          printf '%s\n' "${COMPREPLY[@]}" | grep -Fx bash
      - name: Zsh 자동완성
        shell: bash
        run: |
          ./epa completion zsh > "$RUNNER_TEMP/epa-completion.zsh"
          zsh -n "$RUNNER_TEMP/epa-completion.zsh"
          export PATH="$PWD:$PATH"
          zsh -fc 'compdef() { :; }; compadd() { print -rl -- "${candidates[@]}"; }; source "$RUNNER_TEMP/epa-completion.zsh"; words=(epa install bas); CURRENT=3; _epa_complete' | grep -Fx bash
      - name: Linux cross-builds
        run: |
          for arch in arm64 riscv64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/epa-$arch" ./cmd/epa
          done

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:12', backend: apt}
          - {image: 'ubuntu:24.04', backend: apt}
          - {image: 'rockylinux/rockylinux:9', backend: dnf}
          - {image: 'fedora:44', backend: dnf}
          - {image: 'archlinux:base', backend: pacman}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: CGO_ENABLED=0 go build -trimpath -o epa ./cmd/epa
      - name: Native transaction smoke test in a disposable container
        env:
          IMAGE: ${{ matrix.image }}
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm --mount "type=bind,source=$PWD,target=/epa,readonly" \
            "$IMAGE" bash /epa/tests/distro_smoke.sh /epa/epa "$BACKEND"
