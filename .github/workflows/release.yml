name: Linux 배포

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '정식 버전 태그 (예: v0.1.1)'
        required: true
        type: string
      source_sha:
        description: '검증한 main 커밋의 전체 40자리 SHA'
        required: true
        type: string
      build_run_id:
        description: '게시할 때만: 이전 성공한 빌드 실행 번호'
        required: false
        type: string
      signature:
        description: '게시할 때만: 외부 서명 SHA256SUMS.sig의 Base64 한 줄'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 배포 파일 빌드 및 검증
    if: github.event_name != 'workflow_dispatch' || (inputs.build_run_id == '' && inputs.signature == '')
    runs-on: ubuntu-latest
    steps:
      - name: 수동 배포 입력 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: 소스 코드 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Go 개발 환경 준비
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: 릴리스 버전 및 배포 브랜치 확인
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version=v0.0.0
          source_sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$GITHUB_REF_NAME
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$REQUESTED_VERSION
            [[ "$source_sha" == "$REQUESTED_SHA" ]]
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'EPA_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'EPA_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf '빌드 대상: %s / %s / %s\n' "$version" "$source_sha" "$(go version)"
      - name: Go 검증
        run: |
          go test ./...
          go vet ./...
      - name: 임시 키로 다중 아키텍처 및 설치 검증
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: bash tests/signed_release_smoke.sh
      - name: 운영 공개키를 고정한 배포 빌드
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          EPA_RELEASE_PUBLIC_KEY: ${{ vars.EPA_RELEASE_PUBLIC_KEY }}
        run: |
          bash tests/build_release.sh "$EPA_VERSION" dist "$EPA_SOURCE_SHA"
          (cd dist && sha256sum --strict -c SHA256SUMS)
      - name: 외부 서명용 배포 파일 업로드
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epa-linux-release-${{ env.EPA_VERSION }}
          path: dist/
          if-no-files-found: error

  publish:
    name: 정식 릴리스 게시
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'KRFOSS/epa' && (inputs.build_run_id != '' || inputs.signature != '')
    runs-on: ubuntu-latest
    concurrency:
      group: epa-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      EPA_VERSION: ${{ inputs.version }}
      EPA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: 게시 검증 도구 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 빌드 실행 및 외부 서명 검증
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EPA_SIGNATURE: ${{ inputs.signature }}
          EPA_RELEASE_PUBLIC_KEY: ${{ vars.EPA_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$EPA_VERSION" =~ ^v(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})$ ]]
          [[ "$EPA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$EPA_SIGNATURE" =~ ^[A-Za-z0-9+/]{85}[AQgw]==$ ]]
          git merge-base --is-ancestor "$EPA_SOURCE_SHA" HEAD
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" | jq -e \
            --arg repo "$GH_REPO" --arg tag "$EPA_VERSION" --arg sha "$EPA_SOURCE_SHA" '
              .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"
              and (.path | split("@")[0]) == ".github/workflows/release.yml"
              and ((.event == "workflow_dispatch" and .head_branch == "main")
                   or (.event == "push" and .head_branch == $tag and .head_sha == $sha))' >/dev/null
          gh run download "$BUILD_RUN_ID" --name "epa-linux-release-$EPA_VERSION" --dir dist
          printf '%s' "$EPA_SIGNATURE" | base64 --decode > dist/SHA256SUMS.sig
          bash tests/verify_release.sh "$EPA_VERSION" "$EPA_SOURCE_SHA" dist
      - name: 서명 검증을 통과한 GitHub 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/epa-linux-* dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig)

          # Serialize publication across versions and never make an older
          # version latest. Read all releases, including nonpublic drafts.
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -s 'add // []')
          highest=$(jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' <<< "$releases" |
            { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || [[ $? == 1 ]]; } | LC_ALL=C sort -V | tail -n 1)
          if [[ -n "$highest" ]]; then
            [[ "$EPA_VERSION" != "$highest" && "$EPA_VERSION" == "$(printf '%s\n' "$highest" "$EPA_VERSION" | LC_ALL=C sort -V | tail -n 1)" ]] || {
              echo "Refusing to publish $EPA_VERSION; current highest stable release is $highest" >&2
              exit 1
            }
          fi

          # 태그가 없을 때만 만듭니다. 아래에서 기존 태그의 대상도 다시 확인합니다.
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$EPA_VERSION" |
            jq -r --arg ref "refs/tags/$EPA_VERSION" '.[] | select(.ref == $ref) | .ref')
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$EPA_VERSION" -f sha="$EPA_SOURCE_SHA" >/dev/null
          fi

          # Resolve the actual tag target, including annotated tags.
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$EPA_VERSION" --jq '.object | [.type, .sha] | @tsv')
          read -r type sha <<< "$object"
          for _ in 1 2 3 4 5; do
            [[ "$type" == tag ]] || break
            object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')
            read -r type sha <<< "$object"
          done
          [[ "$type" == commit && "$sha" == "$EPA_SOURCE_SHA" ]]

          # An interrupted upload can be resumed using its existing draft.
          # Never overwrite any asset in an already published release.
          existing=$(jq -c --arg tag "$EPA_VERSION" '[.[] | select(.tag_name == $tag)]' <<< "$releases")
          case $(jq 'length' <<< "$existing") in
            0)
              gh release create "$EPA_VERSION" --verify-tag --draft --title "EPA $EPA_VERSION" \
                --notes 'Linux 바이너리, 설치기 및 서명된 SHA-256 목록을 제공합니다. 공개키 확인과 설치 방법은 README를 참고하세요.'
              ;;
            1) [[ $(jq -r '.[0].draft' <<< "$existing") == true ]] ;;
            *) echo 'Ambiguous release; refusing to publish' >&2; exit 1 ;;
          esac
          [[ $(gh release view "$EPA_VERSION" --json isDraft --jq .isDraft) == true ]]
          gh release upload "$EPA_VERSION" --clobber "${assets[@]}"
          [[ $(gh release view "$EPA_VERSION" --json isDraft --jq .isDraft) == true ]]
          diff -u \
            <(printf '%s\n' "${assets[@]}" | sed 's#^dist/##' | LC_ALL=C sort) \
            <(gh release view "$EPA_VERSION" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          gh release edit "$EPA_VERSION" --draft=false --latest
